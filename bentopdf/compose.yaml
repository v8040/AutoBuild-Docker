services:
  bentopdf:
    container_name: bentopdf
    image: v8040/bentopdf:latest
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
